# Render Blueprint — GeoPulse API web service.
# The database is an external managed Postgres (Neon). Its connection string
# is set manually as the DATABASE_URL env var in the Render dashboard, so it
# is NOT provisioned here (Render's free Postgres expires/deletes after ~30
# days, which took the app down; Neon's free tier is persistent).
services:
  - type: web
    name: geopulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false   # set this yourself in the Render dashboard (Neon connection string)
      - key: GOOGLE_PLACES_API_KEY
        sync: false   # set this yourself in the Render dashboard (your key)
