# Render Blueprint — provisions the GeoPulse API + a Postgres database.
# Deploy: push this repo to GitHub, then on render.com choose New → Blueprint.
services:
  - type: web
    name: geopulse-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: geopulse-db
          property: connectionString
      - key: GOOGLE_PLACES_API_KEY
        sync: false   # set this yourself in the Render dashboard (your key)

databases:
  - name: geopulse-db
    plan: free
